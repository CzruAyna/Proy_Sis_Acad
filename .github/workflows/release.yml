name: Publicación de SIS-INF

on:
  push:
    branches: ['**']
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref || github.run_id }}

jobs:
  version:
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.version.outputs.number }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            version="0.0.0-dev.$GITHUB_RUN_ID"
            tag="build-$GITHUB_RUN_ID"
          else
            tag="$GITHUB_REF_NAME"
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
              echo "Etiqueta no admitida: $tag" >&2
              exit 1
            fi
            version="${tag#v}"
          fi
          printf 'number=%s\ntag=%s\n' "$version" "$tag" >> "$GITHUB_OUTPUT"

  tests:
    needs: version
    uses: ./.github/workflows/ci.yml

  package:
    needs: [version, tests]
    strategy:
      matrix:
        include:
          - target: windows
            runner: ubuntu-24.04
          - target: linux
            runner: ubuntu-24.04
          - target: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      VERSION: ${{ needs.version.outputs.number }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-godot
        with:
          templates: 'true'

      - name: Instalar NSIS para el instalador de Windows
        if: matrix.target == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nsis

      - name: Exportar y comprobar los archivos
        shell: bash
        run: |
          "$GODOT_BIN" --headless --path game --import
          nsis_args=()
          if [[ "$TARGET" == windows ]]; then
            nsis_args+=(--nsis-license /usr/share/doc/nsis/copyright)
          fi
          python3 game/packaging/build_beta.py --godot "$GODOT_BIN" --target "$TARGET" \
            --version "$VERSION" "${nsis_args[@]}"

          bundle="SIS-INF-$VERSION"
          cd game/build/beta
          shasum -a 256 -c "$bundle-SHA256SUMS.txt"
          mkdir release-assets
          case "$TARGET" in
            windows) mv "$bundle-Windows-x64-Setup.exe" release-assets/ ;;
            linux)
              mv "$bundle-Linux-x86_64.tar.gz" "$bundle-Fuentes.zip" release-assets/
              ;;
            macos) mv "$bundle-macOS-Universal.zip" release-assets/ ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: sis-inf-${{ matrix.target }}
          path: game/build/beta/release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    needs: [version, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.number }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sis-inf-*
          merge-multiple: true
          path: release-assets

      - name: Crear la publicación con los archivos verificados
        working-directory: release-assets
        shell: bash
        run: |
          bundle="SIS-INF-$VERSION"
          assets=("$bundle-Windows-x64-Setup.exe" "$bundle-Linux-x86_64.tar.gz"
            "$bundle-macOS-Universal.zip" "$bundle-Fuentes.zip")
          sha256sum "${assets[@]}" > "$bundle-SHA256SUMS.txt"
          sha256sum -c "$bundle-SHA256SUMS.txt"

          guide="$GITHUB_SERVER_URL/$GH_REPO/blob/$GITHUB_SHA/docs/INSTALADORES_BETA.md"
          commit="$GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA"
          notes=$(printf '%s\n\n%s\n%s\n%s\n\n%s' \
            "Descarga el paquete de tu sistema y el manifiesto SHA-256 desde Assets o con GitHub CLI." \
            '~~~sh' \
            "gh release download $RELEASE_TAG --repo $GH_REPO" \
            '~~~' \
            "[Instalación, dependencias y verificación SHA-256]($guide)")
          title="SIS-INF $VERSION"
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            flags=(--target "$GITHUB_SHA" --prerelease --latest=false)
            title="SIS-INF · $GITHUB_REF_NAME · ${GITHUB_SHA:0:7}"
            notes=$(printf '%s\n\n%s' "Compilación de la rama $GITHUB_REF_NAME en el [commit ${GITHUB_SHA:0:7}]($commit)." "$notes")
          else
            flags=(--verify-tag --generate-notes)
            if [[ "$VERSION" == *-beta.* ]]; then
              flags+=(--prerelease --latest=false)
            fi
          fi

          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" == false ]]; then
              echo "La publicación $RELEASE_TAG ya existe."
              exit 0
            fi
            echo "Revisa el borrador existente de $RELEASE_TAG antes de reintentar." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" "$bundle-SHA256SUMS.txt" \
            --title "$title" --notes "$notes" "${flags[@]}"
